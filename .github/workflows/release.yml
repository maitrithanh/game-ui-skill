name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check version tag
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          test "${TAG_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"

      - name: Build and validate release
        run: make release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              "releases/game-ui-v${TAG_NAME#v}.skill" \
              releases/game-ui.skill \
              --clobber
          else
            gh release create "$TAG_NAME" \
              "releases/game-ui-v${TAG_NAME#v}.skill" \
              releases/game-ui.skill \
              --title "game-ui $TAG_NAME" \
              --generate-notes
          fi
