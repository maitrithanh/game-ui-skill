name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and validate release
        run: make release

      - name: Verify repository layout
        run: |
          test -f README.md
          test -f LICENSE
          test -f VERSION
          test -f skill/game-ui/SKILL.md
          test -f demo/index.html
